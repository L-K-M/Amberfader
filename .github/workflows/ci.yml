name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Preserve a result for every main/tag commit; only superseded PR runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: Page bundle lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, typecheck, unit tests
        run: npm run check

      - name: Build the page bundle
        run: npm run build

      - name: Validate shell entry points
        run: bash -n scripts/*.sh

      - name: Check version files stay in sync
        run: npm run version:check

  python:
    name: Python app lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Qt and Qt WebEngine runtime libraries, global-menu test session
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libnss3 libasound2t64 libxkbfile1 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libgbm1 libxcb-dri3-0 libgssapi-krb5-2 \
            xvfb xauth dbus python3-dbus python3-gi

      - name: Sync project environment
        run: uv sync

      - name: Ruff
        run: uv run ruff check native/

      - name: Pytest (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest native/tests/ -q

      - name: Global menu export and activation (X11 and D-Bus)
        env:
          QT_QPA_PLATFORM: xcb
          QT_QPA_PLATFORMTHEME: generic
          AMBERFADER_REQUIRE_GLOBAL_MENU: "1"
        run: >-
          dbus-run-session -- xvfb-run -a uv run pytest
          native/tests/test_global_menu_e2e.py -q -rs

      - name: Schema sync
        run: cmp protocol/schemas/envelope.schema.json native/amberfader/schema/envelope.schema.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the page scripts
        run: npm ci && npm run build

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Wheel and sdist ship the page scripts
        run: |
          unzip -l dist/*.whl | grep -q "amberfader/embedded/web/adapter.js"
          unzip -l dist/*.whl | grep -q "amberfader/embedded/web/ad-filter.js"
          tar -tzf dist/*.tar.gz | grep -q "amberfader/embedded/web/adapter.js"
          tar -tzf dist/*.tar.gz | grep -q "amberfader/embedded/web/ad-filter.js"

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  face-editor-macos:
    name: Face editor and rotated controls (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync editor environment
        run: uv sync

      - name: Editor, persistence and transformed input tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run pytest -q native/tests/test_editor_cli.py
          native/tests/test_editor_player_integration.py
          native/tests/test_face_document.py native/tests/test_face_editor.py
          native/tests/test_face_rotation.py
          native/tests/test_face_focus_rings.py native/tests/test_face_readout_styles.py
          native/tests/test_faces_v3.py native/tests/test_audion_import.py
          native/tests/test_audion_import_ui.py native/tests/test_audion_face_rendering.py
          native/tests/test_audion_popup_keyboard.py native/tests/test_editor_application.py
          native/tests/test_editor_widgets.py native/tests/test_face_autosave.py
          native/tests/test_editor_face_library.py native/tests/test_editor_native_menu.py

  macos:
    name: macOS app build and self-test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the page scripts
        run: npm ci && npm run build

      # A python.org-style build with a shared libpython, as PyInstaller needs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Amberfader and PyInstaller
        run: python -m pip install . "pyinstaller==6.22.3"

      - name: Build Amberfader.app and the .dmg
        run: scripts/build-macos.sh "$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' native/amberfader/__init__.py)" dist

      - name: Self-test the frozen app
        run: dist/macos/dist/Amberfader.app/Contents/MacOS/Amberfader --self-test

      - name: Upload .dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  embedded:
    name: Page bridge end to end in Qt WebEngine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build the page bundle
        run: npm run build

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Qt WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libnss3 libasound2t64 libxkbfile1 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libgbm1 libxcb-dri3-0 \
            libgssapi-krb5-2

      - name: Sync project environment
        run: uv sync

      - name: Bridge end to end against the scripted test page (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          AMBERFADER_REQUIRE_EMBEDDED: "1"
        run: uv run pytest native/tests/test_embedded_e2e.py -q -rs

  deb:
    name: Debian package builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the page scripts
        run: npm ci && npm run build

      - name: Build the .deb
        run: scripts/build-deb.sh "$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' native/amberfader/__init__.py)" dist

      - name: Inspect package contents
        run: |
          dpkg-deb --info dist/amberfader_*_*.deb
          dpkg-deb --contents dist/amberfader_*_*.deb | grep -E "applications|bin/amberfader|icon"

      # Hints and "will be fatal in the future" errors exit 0, so any output fails.
      - name: Validate the desktop entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends desktop-file-utils >/dev/null
          dpkg-deb --fsys-tarfile dist/amberfader_*_*.deb |
            tar -xO ./usr/share/applications/ch.lkmc.amberfader.desktop > ch.lkmc.amberfader.desktop
          report="$(desktop-file-validate ch.lkmc.amberfader.desktop 2>&1)" || true
          if [ -n "$report" ]; then echo "$report"; exit 1; fi

      # Depends must be complete: a clean container has only what they pull
      # in. Root in a container cannot start Chromium's sandbox, so every
      # check but that one must pass here; the next step covers the sandbox.
      # The self-test runs offscreen, so the desktop platform plugins are
      # checked with ldd (the Wayland server plugins are never loaded).
      - name: Self-test the .deb in a clean Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 sh -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              /dist/amberfader_*_*.deb >/dev/null &&
            cd /opt/amberfader/lib/PySide6/Qt &&
            ldd libexec/QtWebEngineProcess plugins/platforms/*.so plugins/xcbglintegrations/*.so \
              plugins/wayland-decoration-client/*.so plugins/wayland-graphics-integration-client/*.so \
              plugins/wayland-shell-integration/*.so | grep "not found" | sort -u | sed "s/^/missing: /"
            QT_QPA_PLATFORM=offscreen QTWEBENGINE_DISABLE_SANDBOX=1 amberfader --self-test
          ' | tee self-test.log
          if grep "^missing: " self-test.log; then exit 1; fi
          # The verdict line prints only when the self-test ran to the end.
          grep -q "^amberfader self-test: " self-test.log
          grep -q "^self-test: attach: ok" self-test.log
          if grep "^self-test: .*: FAILED" self-test.log | grep -v "renderer sandbox"; then
            exit 1
          fi

      # Ubuntu 23.10+ restricts unprivileged user namespaces through
      # AppArmor; the deb's profile must let Chromium's sandbox start anyway.
      - name: Install the .deb and self-test it with the sandbox restricted
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ./dist/amberfader_*_*.deb
          sudo aa-status | grep amberfader
          # Under the restriction an unconfined process cannot map itself
          # into a new user namespace; without it this step proves nothing.
          if unshare -Ur true; then
            echo "::error::user namespaces are not restricted; the profile is untested"; exit 1
          fi
          QT_QPA_PLATFORM=offscreen amberfader --self-test
          # Control: started outside the profile's path, the same app must
          # lose Chromium's namespace layer, so the profile is what grants it.
          PYTHONPATH=/opt/amberfader/lib QT_QPA_PLATFORM=offscreen timeout 120 \
            python3 -m amberfader --self-test > control.log 2>&1 || true
          grep "renderer sandbox" control.log || true
          if ! grep -q "renderer sandbox: FAILED (seccomp only)" control.log; then
            echo "::error::the control run did not lose the namespace layer"; exit 1
          fi

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Flatpak builds and self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the page scripts and the wheel
        run: npm ci && npm run build && uv build --wheel --out-dir dist

      # Only this job relaxes the restriction: bubblewrap, which builds and
      # runs every Flatpak, needs unprivileged user namespaces.
      - name: Build the Flatpak
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true   # absent on kernels without the knob
          sudo apt-get update -qq
          # elfutils: flatpak-builder runs eu-strip. dbus: the self-test below.
          sudo apt-get install -y -qq --no-install-recommends flatpak flatpak-builder elfutils dbus >/dev/null
          scripts/build-flatpak.sh dist/amberfader-*.whl

      - name: Install the bundle and check its permissions
        run: |
          flatpak install --user -y --noninteractive dist/amberfader_*.flatpak
          flatpak info --user --show-permissions ch.lkmc.amberfader | tee permissions.txt
          grep -Fxq 'com.canonical.AppMenu.Registrar=talk' permissions.txt
          grep -q '^shared=.*network' permissions.txt
          grep -q '^sockets=.*pulseaudio' permissions.txt
          grep -q '^filesystems=.*xdg-run/amberfader:create' permissions.txt

      # Chromium's renderers run in a sub-sandbox that the Flatpak portal
      # starts, which needs a session bus, as every desktop session has.
      - name: Self-test the installed Flatpak
        run: dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen ch.lkmc.amberfader --self-test

      # Each Flatpak instance has its own sandbox; the shared xdg-run folder is
      # what lets a second launch find the first one's socket.
      - name: A second launch hands over to the running one
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            app=(flatpak run --env=QT_QPA_PLATFORM=offscreen ch.lkmc.amberfader --test-page --background)
            socket="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/amberfader/embedded.sock"
            rm -f "$socket"
            "${app[@]}" > first.log 2>&1 &
            first=$!
            for _ in $(seq 90); do [ -S "$socket" ] && break; sleep 1; done
            [ -S "$socket" ] || { cat first.log; echo "::error::no socket from the first instance"; exit 1; }
            timeout 60 "${app[@]}"
            kill -0 "$first" || { cat first.log; echo "::error::the first instance stopped"; exit 1; }
            flatpak kill ch.lkmc.amberfader
          '

      - name: Checksum the bundle
        run: cd dist && for f in amberfader_*.flatpak; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload the Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-flatpak
          path: |
            dist/*.flatpak
            dist/*.flatpak.sha256
          if-no-files-found: error
          retention-days: 7
