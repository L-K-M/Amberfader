name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Preserve a result for every main/tag commit; only superseded PR runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: Extension lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, typecheck, unit tests
        run: npm run check

      - name: Build extension and run web-ext lint
        run: npm run ext:lint

      - name: Package the extension zip
        run: npm run ext:package

      - name: Upload extension zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-extension
          path: dist/web-ext-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Validate shell entry points
        run: bash -n scripts/*.sh

      - name: Check version files stay in sync
        run: npm run version:check

  python:
    name: Native helper/GUI lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v7.1.2

      - name: Qt runtime libraries for offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 \
            libfontconfig1 libdbus-1-3

      - name: Sync project environment
        run: uv sync --extra gui

      - name: Ruff
        run: uv run ruff check native/

      - name: Pytest (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest native/tests/ -q

      - name: Schema sync
        run: cmp protocol/schemas/envelope.schema.json native/amberfader/schema/envelope.schema.json

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  face-editor-macos:
    name: Face editor and rotated controls (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v7.1.2

      - name: Sync editor environment
        run: uv sync --extra gui

      - name: Editor, persistence and transformed input tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run pytest -q native/tests/test_editor_cli.py
          native/tests/test_editor_player_integration.py
          native/tests/test_face_document.py native/tests/test_face_editor.py
          native/tests/test_face_rotation.py

  deb:
    name: Debian package builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v7.1.2

      - name: Build the .deb
        run: scripts/build-deb.sh "$(node -p "JSON.parse(require('node:fs').readFileSync('extension/manifest.json','utf8')).version")" dist

      - name: Inspect package contents
        run: |
          dpkg-deb --info dist/amberfader_*_*.deb
          dpkg-deb --contents dist/amberfader_*_*.deb | grep -E "native-messaging-hosts|applications|amberfader-helper|icon"

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Repack as Flatpak and smoke-check the payload
        run: |
          # Ubuntu 24.04 denies the unprivileged user namespaces bubblewrap
          # (flatpak's sandbox helper) builds in.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true   # absent on kernels without the knob
          # elfutils is required: flatpak-builder execs eu-strip on payload ELFs
          sudo apt-get update && sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils
          DEB="$(find dist -maxdepth 1 -type f -name 'amberfader_*.deb' -print -quit)"
          [ -n "$DEB" ] || { echo "::error::no .deb to repack"; exit 1; }
          scripts/build-flatpak.sh "$DEB"

      - name: Checksum and upload Flatpak bundle
        run: |
          for f in dist/*.flatpak; do
            (cd dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256")
          done
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-flatpak
          path: |
            dist/*.flatpak
            dist/*.flatpak.sha256
          if-no-files-found: error
          retention-days: 7
