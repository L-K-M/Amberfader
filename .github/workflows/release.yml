name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Match tag, version files, and main history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ "$TAG" != v* || ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Release tag must use vX.Y.Z or vX.Y.Z-pre form."
            exit 1
          fi

          SOURCE_VERSION="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' native/amberfader/__init__.py)"
          if [[ "$VERSION" != "$SOURCE_VERSION" ]]; then
            echo "::error::Tag $TAG must match __version__ in native/amberfader/__init__.py ($SOURCE_VERSION)."
            exit 1
          fi

          npm ci --ignore-scripts
          npm run version:check

          if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            echo "::error::Release tag commit must be on main."
            exit 1
          fi

  ci:
    name: Gate on CI
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  artifacts:
    name: Build deb and flatpak, publish the release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write  # gh release create uploads assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install locked dependencies and build the page scripts
        run: npm ci && npm run build

      - name: Build .deb
        # The verify job already proved ref_name is vX.Y.Z; strip the v —
        # Debian versions must start with a digit.
        run: scripts/build-deb.sh "${GITHUB_REF_NAME#v}" dist

      # This job builds its own .deb; check the notices in the one it uploads.
      - name: Check the license notices in the .deb
        run: |
          dpkg-deb -x dist/amberfader_*_*.deb "$RUNNER_TEMP/deb"
          doc="$RUNNER_TEMP/deb/usr/share/doc/amberfader"
          for f in copyright Third-Party-Notices.txt Rust-Licenses.html SOURCES.txt; do
            test -s "$doc/$f" || { echo "::error::$f missing or empty"; exit 1; }
          done
          grep -q '^PySide6_Essentials 6\.' "$doc/Third-Party-Notices.txt"
          grep -q '^FFmpeg, version ' "$doc/Third-Party-Notices.txt"
          grep -q '^rpds-py ' "$doc/Third-Party-Notices.txt"
          grep -qx 'License: Unlicense' "$doc/copyright"

      - name: Build .flatpak
        # flatpak-builder was never installed here, so the old `|| warning`
        # skipped the artifact on every release. Install it and fail hard —
        # a broken build must not ship a release that's silently missing
        # the flatpak.
        run: |
          # Ubuntu 24.04 denies the unprivileged user namespaces bubblewrap
          # (flatpak's sandbox helper) builds in.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true   # absent on kernels without the knob
          # elfutils is required: flatpak-builder execs eu-strip on payload ELFs
          sudo apt-get update && sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils
          uv build --wheel --out-dir dist/wheel
          scripts/build-flatpak.sh dist/wheel/amberfader-*.whl

      # This job builds its own bundle; install it to check its notices.
      - name: Check the license notices in the .flatpak
        run: |
          flatpak install --user -y --noninteractive dist/amberfader_*.flatpak
          app="$(flatpak info --user --show-location ch.lkmc.amberfader)/files"
          doc="$app/share/doc/amberfader"
          for f in Third-Party-Notices.txt Rust-Licenses.html SOURCES.txt; do
            test -s "$doc/$f" || { echo "::error::$f missing or empty"; exit 1; }
          done
          grep -q '^PySide6' "$doc/Third-Party-Notices.txt"
          grep -q '^Qt WebEngine, Qt PDF and Qt WebView ' "$doc/Third-Party-Notices.txt"
          grep -q '^rpds-py ' "$doc/Third-Party-Notices.txt"
          grep -q 'io.qt.qtwebengine.BaseApp' "$doc/SOURCES.txt"
          grep -q '<project_license>Unlicense</project_license>' "$app/share/metainfo/ch.lkmc.amberfader.metainfo.xml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amberfader-${{ github.ref_name }}
          path: |
            dist/*.deb
            dist/*.flatpak
          if-no-files-found: warn
          retention-days: 30

      # Built and self-tested by ci.yml's macos job in this same run; the
      # verify job proved the tag matches __version__, which names the .dmg.
      - name: Download the macOS .dmg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The README promises every package from 0.2.0 on.
          for package in deb flatpak dmg; do
            compgen -G "dist/*.$package" >/dev/null || { echo "::error::no .$package"; exit 1; }
          done
          # The .dmg comes with its checksum from CI's macos job.
          (cd dist && for f in *.deb *.flatpak; do sha256sum "$f" > "$f.sha256"; done)
          artifacts=()
          while IFS= read -r f; do artifacts+=("$f"); done < <(find dist -maxdepth 2 -type f \( -name '*.deb' -o -name '*.flatpak' -o -name '*.dmg' -o -name '*.sha256' \))
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::no release artifacts produced"
            exit 1
          fi
          # This version's CHANGELOG section leads the notes; GitHub appends
          # the merged pull requests.
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $version"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "Amberfader ${{ github.ref_name }}" \
            --notes-file release-notes.md --generate-notes \
            "${artifacts[@]}"
