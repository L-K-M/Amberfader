<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'" />
    <title>Amberfader — Search</title>
    <link rel="stylesheet" href="css/player.css" />
    <style>
      #search { width: 400px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      #q { width: 100%; font: inherit; padding: 4px 6px; background: var(--bg2); color: var(--text); border: 1px solid var(--edge); border-radius: 3px; }
      #results { flex: 1; overflow-y: auto; max-height: 400px; margin: 0; padding: 0; list-style: none; }
      #results li { padding: 5px 6px; border-bottom: 1px solid #3a2c18; cursor: pointer; }
      #results li:hover { background: var(--bg2); }
      #results li .r-title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #results li .r-sub { color: var(--dim); font-size: 11px; }
      #results li.unsupported { opacity: 0.5; cursor: default; }
      .recents { display: flex; flex-wrap: wrap; gap: 4px; max-height: 90px; overflow-y: auto; }
      .recent-label { color: var(--dim); margin: 0 0 4px; }
      .row-actions { display: flex; gap: 6px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main id="search" aria-label="Search YouTube Music">
      <input id="q" type="search" placeholder="Search songs — Enter submits"
             aria-label="Search query" maxlength="500" autofocus />
      <section aria-label="Recent searches">
        <p class="recent-label">Recent searches</p>
        <div id="recent-queries" class="recents"></div>
      </section>
      <section aria-label="Recent artists">
        <p class="recent-label">Recent artists</p>
        <div id="recent-artists" class="recents"></div>
      </section>
      <button id="clear-history">Clear recents</button>
      <ul id="results" aria-label="Results"></ul>
      <div id="sstatus" class="status" role="status" aria-live="polite"></div>
    </main>
    <script src="js/search.js"></script>
  </body>
</html>
