[project]
name = "amberfader"
version = "0.2.0"
description = "Compact classic-style player for YouTube Music with its own embedded browser"
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.11"
# Before 6.12, Addons bundles WebEngine and its wheels support macOS 13.
dependencies = [
    "jsonschema>=4.23,<5",
    "PySide6-Essentials>=6.8,<6.12",
    "PySide6-Addons>=6.8,<6.12",
]

[project.scripts]
amberfader = "amberfader.embedded.__main__:main"
amberfader-face-editor = "amberfader.editor_app:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Built by `npm run build` and ignored by git; ship them anyway.
artifacts = ["native/amberfader/embedded/web/*.js"]

[tool.hatch.build.targets.wheel]
packages = ["native/amberfader"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["native/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["native"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    # Qt APIs use camelCase by design.
    "N802", "N803",
]
# UI copy intentionally uses an en dash as a separator.
allowed-confusables = ["–"]
